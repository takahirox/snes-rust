name: Emulator checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Verify original ROM is reproducible
        run: |
          python3 tools/make-fixture.py .cache/smoke.bin
          cmp tests/roms/smoke.bin .cache/smoke.bin
      - name: Build pinned assemblers
        run: python3 tools/build-test-tools.py --spc
      - name: CPU and SPC700 ROM suites
        run: >-
          python3 tools/hardware-tests.py
          --ca65 "$PWD/.cache/tools/cc65/bin/ca65"
          --ld65 "$PWD/.cache/tools/cc65/bin/ld65"
          --spcasm "$PWD/.cache/tools/spcasm/target/release/spcasm"
      - name: Scanline HDMA fixture
        run: python3 tools/ppu-test.py --bass "$PWD/.cache/tools/bass-untech/bass/out/bass-untech"
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build audited game artifacts from pinned source
        run: |
          python3 tools/build-test-tools.py
          python3 tools/build-cleared-games.py
          python3 tools/build-cleared-games.py
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm test -- --grep-invert '301 seconds'
        working-directory: web
