<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'">
  <title>snes-rust · Experimental SNES emulator</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <header>
      <div class="app-identity"><h1>snes-rust</h1><p>SNES emulator</p></div>
      <nav aria-label="Information">
        <details>
          <summary>Help</summary>
          <div class="controls-reference">
            <h2>Keyboard</h2>
            <dl>
              <dt>Arrow keys</dt><dd>Move</dd>
              <dt><kbd>Z</kbd> / <kbd>X</kbd></dt><dd>B / A</dd>
              <dt><kbd>A</kbd> / <kbd>S</kbd></dt><dd>Y / X</dd>
              <dt><kbd>Q</kbd> / <kbd>W</kbd></dt><dd>L / R</dd>
              <dt><kbd>Enter</kbd> / <kbd>Shift</kbd></dt><dd>Start / Select</dd>
            </dl>
            <p>Slide across the touch D-pad for diagonals. Standard gamepads work.</p>
          </div>
        </details>
        <a href="https://github.com/takahirox/snes-rust">GitHub</a>
      </nav>
      <div class="display-controls" role="group" aria-label="Display settings">
        <label>Scale <select id="scale"><option value="1">1×</option><option value="2">2×</option><option value="3" selected>3×</option></select></label>
        <label>Display <select id="display"><option value="crt">CRT</option><option value="pixel">Pixel</option></select></label>
      </div>
    </header>
    <section class="player" aria-label="SNES player">
      <div class="screen"><canvas id="video" tabindex="0" width="256" height="224" aria-label="Emulated SNES display"></canvas><span id="placeholder">Insert a cartridge</span></div>
      <div class="game-entry" role="group" aria-label="Cartridge slot">
        <div class="cartridge-value"><span id="cartridge-label">Inserted cartridge</span><p id="current-game" aria-labelledby="cartridge-label" title="None">None</p></div>
        <button id="change-cartridge" popovertarget="cartridge-picker" aria-haspopup="dialog" disabled>Insert cartridge</button>
        <div id="cartridge-picker" popover role="dialog" aria-labelledby="cartridge-title">
          <h2 id="cartridge-title">Cartridges</h2>
          <button id="demo" autofocus disabled>Bundled demo — <span lang="ja">潮鳴りの密室</span></button>
          <button id="demo-yonaki" disabled>Bundled demo — <span lang="ja">夜鳴き鐘</span></button>
          <button id="open-local" disabled>Open local ROM…</button>
        </div>
        <input id="rom" type="file" hidden disabled accept=".sfc,.smc" aria-label="Open local ROM">
      </div>
      <div class="toolbar" role="group" aria-label="Playback controls">
        <button id="play" disabled>Play</button>
        <button id="reset" disabled>Reset</button>
        <div id="volume-control" role="group" aria-label="Audio">
          <button id="mute" type="button" aria-label="Mute" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4 5 9H2v6h3l6 5Z"/>
              <path class="sound-waves" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/>
              <path class="mute-mark" d="m16 9 6 6m0-6-6 6"/>
            </svg>
          </button>
          <input id="volume" type="range" min="0" max="100" step="1" value="100" aria-label="Volume">
        </div>
        <button id="fullscreen">Fullscreen</button>
        <p id="status" role="status">Loading emulator…</p>
      </div>
      <div class="touch-controls" role="group" aria-label="SNES touch controls">
        <div class="left-controls">
          <button class="shoulder" data-button="32" aria-label="SNES L" disabled>L</button>
          <div class="dpad" role="group" aria-label="Directional pad">
            <button data-button="2048" aria-label="SNES Up" disabled>▲</button>
            <button data-button="512" aria-label="SNES Left" disabled>◀</button>
            <button data-button="256" aria-label="SNES Right" disabled>▶</button>
            <button data-button="1024" aria-label="SNES Down" disabled>▼</button>
          </div>
          <button class="system" data-button="8192" aria-label="SNES Select" disabled>Select</button>
        </div>
        <div class="right-controls">
          <button class="shoulder" data-button="16" aria-label="SNES R" disabled>R</button>
          <div class="face-buttons">
            <button data-button="64" aria-label="SNES X" disabled>X</button>
            <button data-button="16384" aria-label="SNES Y" disabled>Y</button>
            <button data-button="128" aria-label="SNES A" disabled>A</button>
            <button data-button="32768" aria-label="SNES B" disabled>B</button>
          </div>
          <button class="system" data-button="4096" aria-label="SNES Start" disabled>Start</button>
        </div>
      </div>
    </section>
    <p id="error" role="alert"></p>
    <p id="audio-status" role="status"></p>
    <p id="display-status" role="status"></p>
    <button id="retry-save" hidden>Retry restoring save</button>
  </main>
</body>
</html>
